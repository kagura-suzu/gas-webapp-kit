<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --text: #1f2328;
    --muted: #59636e;
    --border: #d1d9e0;
    --accent: #1a6fd1;
    --accent-text: #ffffff;
    --danger: #c62828;
    --ok: #1b7f3b;
    --focus: #1a6fd1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }
  .app-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
  }
  .app-header h1 { margin: 0; font-size: 20px; }
  .layout {
    display: grid;
    gap: 16px;
    max-width: 1080px;
    margin: 0 auto;
    padding: 16px;
    grid-template-columns: minmax(0, 1fr);
  }
  @media (min-width: 900px) {
    .layout { grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); align-items: start; }
    .selftest { grid-column: 1 / -1; }
  }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }
  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 12px;
  }
  .panel-head h2 { margin: 0; font-size: 18px; }
  .field { margin-bottom: 12px; }
  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .required {
    font-size: 12px;
    color: var(--danger);
    border: 1px solid var(--danger);
    border-radius: 4px;
    padding: 0 4px;
    margin-left: 4px;
  }
  input, textarea {
    width: 100%;
    font: inherit;
    font-size: 16px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
    resize: vertical;
  }
  input[aria-invalid="true"], textarea[aria-invalid="true"] { border-color: var(--danger); }
  .field-error { color: var(--danger); font-size: 14px; margin: 4px 0 0; min-height: 0; }
  .field-error:empty { display: none; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  button {
    min-height: 44px;
    padding: 8px 20px;
    font: inherit;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border: 1px solid var(--accent); font-weight: 600; }
  button.secondary { background: var(--surface); color: var(--accent); border: 1px solid var(--accent); }
  button:disabled { opacity: 0.6; cursor: wait; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .status { margin: 0; color: var(--muted); font-size: 14px; }
  .status.error { color: var(--danger); }
  .status.ok { color: var(--ok); }
  .records { width: 100%; border-collapse: collapse; }
  .records th {
    text-align: left;
    font-size: 14px;
    color: var(--muted);
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    padding: 8px;
  }
  .records td { padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: top; overflow-wrap: anywhere; }
  .records td.date { white-space: nowrap; color: var(--muted); font-size: 14px; }
  @media (max-width: 599px) {
    .records thead { display: none; }
    .records tr { display: block; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .records td { display: block; border: 0; padding: 2px 0; }
  }
  .selftest {
    border: 2px solid var(--muted);
    border-radius: 8px;
    padding: 16px;
    background: var(--surface);
  }
  .selftest.pass { border-color: var(--ok); }
  .selftest.fail { border-color: var(--danger); }
  .selftest h2 { margin: 0 0 8px; font-size: 22px; }
  .selftest.pass h2 { color: var(--ok); }
  .selftest.fail h2 { color: var(--danger); }
  .selftest ul { margin: 0; padding-left: 20px; }
  .selftest li.ng { color: var(--danger); font-weight: 600; }
</style>
